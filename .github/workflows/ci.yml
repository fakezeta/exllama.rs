name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: exllama-server-linux-x86_64
            features: ""
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: exllama-server-linux-arm64
            features: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: exllama-server-macos-arm64
            features: "gpu-metal"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: exllama-server-windows-x86_64.exe
            features: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-${{ matrix.features }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Build (debug)
        run: cargo build --verbose ${{ matrix.features && format('--features {0}', matrix.features) || '' }}

      - name: Test
        run: cargo test --verbose ${{ matrix.features && format('--features {0}', matrix.features) || '' }}

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }} ${{ matrix.features && format('--features {0}', matrix.features) || '' }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            target/${{ matrix.target }}/release/exllama-server
            target/${{ matrix.target }}/release/exllama-server.exe
          if-no-files-found: ignore

  clippy:
    name: Clippy (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
